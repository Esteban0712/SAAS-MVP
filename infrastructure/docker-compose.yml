services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: deenova_dev
      POSTGRES_USER: deenova
      # Credencial exclusiva para desarrollo local. No usar en otros entornos.
      POSTGRES_PASSWORD: deenova_local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deenova -d deenova_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
